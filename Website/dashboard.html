<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bento Boss — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#FFF4D8',
            rice: '#FDFCF8',
            loam: '#4C3737',
            moss: '#5D7052',
            clay: '#C18C5D',
            sand: '#E6DCCD',
            bark: '#4A4A40',
            stone: '#F0EBE5',
            grass: '#78786C',
            timber: '#DED8CF',
            sienna: '#A85448',
            ember: '#AC3737',
          },
          fontFamily: {
            heading: ['Fraunces', 'Georgia', 'serif'],
            body: ['Nunito', 'sans-serif'],
          },
          borderRadius: {
            'blob': '60% 40% 30% 70% / 60% 30% 70% 40%',
            'blob-2': '40% 60% 70% 30% / 40% 70% 30% 60%',
            'organic': '2rem',
            'organic-lg': '3rem',
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(93, 112, 82, 0.15)',
            'float': '0 10px 40px -10px rgba(193, 140, 93, 0.2)',
            'lift': '0 20px 40px -10px rgba(93, 112, 82, 0.15)',
          }
        }
      }
    }
  </script>
  <style>
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.035;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 128px 128px;
    }
    /* Smooth expand/collapse for session detail */
    .session-detail-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease-in-out;
    }
    .session-detail-panel.open {
      max-height: 5000px;
    }
    /* Horizontal scroll for tables on mobile */
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  </style>
</head>
<body class="bg-cream font-body text-loam min-h-screen relative overflow-x-hidden">

  <!-- Decorative blobs -->
  <div class="absolute top-[5%] left-[-5%] w-[400px] h-[400px] bg-moss/10 rounded-blob blur-3xl pointer-events-none z-0"></div>
  <div class="absolute top-[10%] right-[-8%] w-[500px] h-[500px] bg-clay/10 rounded-blob-2 blur-3xl pointer-events-none z-0"></div>

  <!-- Loading spinner (shown while auth check) -->
  <div id="loading-screen" class="fixed inset-0 bg-cream z-50 flex items-center justify-center">
    <div class="text-center">
      <div class="w-12 h-12 border-4 border-moss/30 border-t-moss rounded-full animate-spin mx-auto mb-4"></div>
      <p class="text-base text-grass font-semibold">Loading dashboard...</p>
    </div>
  </div>

  <!-- Main app (hidden until auth confirmed) -->
  <div id="app" class="hidden">

    <!-- Sticky header -->
    <header class="sticky top-0 z-40 bg-rice/80 backdrop-blur-md border-b border-timber">
      <div class="max-w-[1600px] 2xl:max-w-[1800px] mx-auto px-6 md:px-10 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div id="header-logo-placeholder" class="h-10 w-10 md:h-12 md:w-12 rounded-xl bg-moss/10 animate-pulse"></div>
          <img id="header-logo-img" src="" alt="Logo" class="h-10 w-10 md:h-12 md:w-12 rounded-xl hidden" />
          <h1 class="font-heading text-xl md:text-2xl font-bold text-loam">Bento Boss</h1>
        </div>
        <div class="flex items-center gap-3 md:gap-4 flex-wrap justify-end">
          <span id="admin-badge" class="hidden bg-moss/15 text-moss text-sm font-semibold rounded-full px-3 py-1">Admin</span>
          <span id="header-username" class="text-base text-loam font-semibold hidden md:inline"></span>
          <!-- Export dropdown (admin only) -->
          <div id="export-dropdown-wrapper" class="hidden relative">
            <button id="export-btn" onclick="toggleExportDropdown()" class="border-2 border-timber text-loam hover:bg-stone rounded-full px-5 h-10 text-sm font-semibold transition-all duration-300 flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              Export
            </button>
            <div id="export-dropdown" class="hidden absolute right-0 top-full mt-2 bg-rice rounded-2xl shadow-lift border border-timber py-2 w-48 z-50">
              <button onclick="exportJSON()" class="w-full text-left px-5 py-3 text-base font-semibold text-loam hover:bg-stone transition-colors">Export JSON</button>
              <button onclick="exportCSV()" class="w-full text-left px-5 py-3 text-base font-semibold text-loam hover:bg-stone transition-colors">Export CSV</button>
            </div>
          </div>
          <button onclick="handleLogout()" class="border-2 border-clay text-clay hover:bg-clay hover:text-white rounded-full px-6 h-12 text-base font-semibold transition-all duration-300">Logout</button>
        </div>
      </div>
    </header>

    <!-- Dashboard content -->
    <main class="max-w-[1600px] 2xl:max-w-[1800px] mx-auto px-6 md:px-10 py-10 md:py-16 relative z-10">

      <!-- Page title -->
      <h2 class="font-heading text-4xl md:text-5xl 2xl:text-6xl font-bold text-loam mb-10 md:mb-16">Dashboard</h2>

      <!-- Section A: Overview Stats -->
      <section class="mb-10 md:mb-16">
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8">
          <div class="bg-rice rounded-[2rem] shadow-soft border border-timber p-8 md:p-10 2xl:p-12 hover:-translate-y-1 hover:shadow-float transition-all duration-300">
            <p id="stat-players" class="font-heading text-4xl md:text-5xl font-bold text-moss">-</p>
            <p class="text-base md:text-lg text-grass font-medium mt-2">Total Players</p>
          </div>
          <div class="bg-rice rounded-[2rem] shadow-soft border border-timber p-8 md:p-10 2xl:p-12 hover:-translate-y-1 hover:shadow-float transition-all duration-300">
            <p id="stat-sessions" class="font-heading text-4xl md:text-5xl font-bold text-moss">-</p>
            <p class="text-base md:text-lg text-grass font-medium mt-2">Total Sessions</p>
          </div>
          <div class="bg-rice rounded-[2rem] shadow-soft border border-timber p-8 md:p-10 2xl:p-12 hover:-translate-y-1 hover:shadow-float transition-all duration-300">
            <p id="stat-balance" class="font-heading text-4xl md:text-5xl font-bold text-moss">-</p>
            <p class="text-base md:text-lg text-grass font-medium mt-2">Avg Balance</p>
          </div>
          <div class="bg-rice rounded-[2rem] shadow-soft border border-timber p-8 md:p-10 2xl:p-12 hover:-translate-y-1 hover:shadow-float transition-all duration-300">
            <p id="stat-time" class="font-heading text-4xl md:text-5xl font-bold text-moss">-</p>
            <p class="text-base md:text-lg text-grass font-medium mt-2">Avg Session Time</p>
          </div>
        </div>
      </section>

      <!-- Desktop layout: Players table + Leaderboard sidebar -->
      <div class="flex flex-col lg:flex-row gap-8 md:gap-10">

        <!-- Section B: Players Table (main column) -->
        <section class="flex-1 min-w-0">
          <div class="flex items-center justify-between mb-6 flex-wrap gap-4">
            <h3 class="font-heading text-2xl md:text-3xl font-bold text-loam">Players</h3>
            <div id="table-export-btns" class="hidden flex gap-3">
              <button onclick="exportJSON()" class="bg-stone text-loam border border-timber hover:bg-sand rounded-full px-4 py-2 text-sm font-semibold transition-all duration-300">Export JSON</button>
              <button onclick="exportCSV()" class="bg-stone text-loam border border-timber hover:bg-sand rounded-full px-4 py-2 text-sm font-semibold transition-all duration-300">Export CSV</button>
            </div>
          </div>

          <!-- Players table -->
          <div class="bg-rice rounded-[2rem] shadow-soft border border-timber overflow-hidden">
            <div class="table-scroll">
              <table class="w-full min-w-[700px]">
                <thead>
                  <tr class="bg-stone text-loam font-semibold text-base md:text-lg">
                    <th class="text-left py-5 px-6">Username</th>
                    <th class="text-left py-5 px-6">Email</th>
                    <th class="text-left py-5 px-6">Sessions</th>
                    <th class="text-left py-5 px-6">Best Score</th>
                    <th class="text-left py-5 px-6">Last Played</th>
                    <th id="actions-header" class="text-left py-5 px-6 hidden">Actions</th>
                  </tr>
                </thead>
                <tbody id="players-tbody">
                  <!-- Rows injected by JS -->
                </tbody>
              </table>
            </div>
            <!-- Empty state -->
            <div id="empty-players" class="hidden text-center py-16">
              <svg class="w-16 h-16 text-timber mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <p class="text-grass text-lg font-medium">No players yet</p>
            </div>
          </div>

          <!-- Session detail panel (injected below table row when clicked) -->
          <div id="session-detail-container"></div>
        </section>

        <!-- Section D: Leaderboard sidebar -->
        <aside class="lg:w-[340px] 2xl:w-[400px] shrink-0">
          <h3 class="font-heading text-2xl md:text-3xl font-bold text-loam mb-6">Leaderboard</h3>
          <div class="bg-rice rounded-[2rem] shadow-soft border border-timber p-8">
            <div id="leaderboard-list">
              <p class="text-grass text-lg text-center py-8">No data yet</p>
            </div>
          </div>
        </aside>
      </div>

      <!-- Section E: Danger Zone (admin only) -->
      <section id="danger-zone" class="hidden mt-16">
        <h3 class="font-heading text-xl font-bold text-ember mb-4">Danger Zone</h3>
        <div class="bg-rice rounded-[2rem] border-2 border-ember/30 p-8">
          <p class="text-base text-grass mb-6">These actions are irreversible. Proceed with caution.</p>
          <button onclick="startResetAll()" class="bg-ember text-white rounded-full h-14 px-10 text-lg font-bold hover:bg-ember/90 active:scale-95 transition-all duration-300">Reset All Data</button>
        </div>
      </section>

    </main>
  </div>

  <!-- Modal container -->
  <div id="modal-overlay" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="closeModalOnBackdrop(event)">
    <div id="modal-card" class="bg-rice rounded-[2rem] shadow-lift p-8 md:p-10 max-w-md mx-auto w-full transform transition-all duration-300 scale-95 opacity-0">
      <h4 id="modal-title" class="font-heading text-xl font-bold text-loam"></h4>
      <p id="modal-desc" class="text-base text-grass mt-2"></p>
      <div id="modal-input-area" class="hidden mt-4">
        <input id="modal-input" type="text" placeholder='Type "RESET" to confirm'
          class="rounded-full h-14 px-7 text-base w-full border-2 border-timber bg-white/60 focus:border-ember focus:ring-2 focus:ring-ember/20 focus:outline-none placeholder-grass transition-all duration-300" />
      </div>
      <div id="modal-buttons" class="flex gap-4 mt-8 justify-end"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-[60] flex flex-col gap-3"></div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getStorage, ref as storageRef, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

    // Firebase config — replace with your real credentials
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "000000000000",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const storage = getStorage(app);

    // Global state
    let currentUser = null;
    let isAdmin = false;
    let usersData = {};
    let sessionsData = {};
    let expandedPlayerUid = null;
    let selectedSessionKey = null;

    // ─── Auth guard ──────────────────────────────────────────
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;

      // Check admin status from database
      try {
        const snap = await get(ref(db, 'users/' + user.uid + '/isAdmin'));
        isAdmin = snap.val() === true;
      } catch (e) {
        isAdmin = false;
      }

      // Show app, hide loading
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');

      // Set header username
      try {
        const uSnap = await get(ref(db, 'users/' + user.uid + '/username'));
        document.getElementById('header-username').textContent = uSnap.val() || user.email;
      } catch (e) {
        document.getElementById('header-username').textContent = user.email;
      }

      // Show admin UI elements
      if (isAdmin) {
        document.getElementById('admin-badge').classList.remove('hidden');
        document.getElementById('export-dropdown-wrapper').classList.remove('hidden');
        document.getElementById('table-export-btns').classList.remove('hidden');
        document.getElementById('actions-header').classList.remove('hidden');
        document.getElementById('danger-zone').classList.remove('hidden');
      }

      // Load logo
      loadLogo();

      // Set up real-time listeners
      setupListeners();
    });

    // ─── Logo loading ────────────────────────────────────────
    async function loadLogo() {
      try {
        const logoRef = storageRef(storage, 'logo.png');
        const logoURL = await getDownloadURL(logoRef);
        const img = document.getElementById('header-logo-img');
        const placeholder = document.getElementById('header-logo-placeholder');
        img.src = logoURL;
        img.onload = () => {
          placeholder.classList.add('hidden');
          img.classList.remove('hidden');
        };
        img.onerror = () => { placeholder.classList.add('hidden'); };
      } catch (e) {
        document.getElementById('header-logo-placeholder').classList.add('hidden');
      }
    }

    // ─── Real-time data listeners ────────────────────────────
    function setupListeners() {
      // Listen to users node
      onValue(ref(db, 'users'), (snapshot) => {
        usersData = snapshot.val() || {};
        rebuildDashboard();
      }, (err) => {
        console.error('Users listener error:', err);
      });

      // Listen to sessions node
      onValue(ref(db, 'sessions'), (snapshot) => {
        sessionsData = snapshot.val() || {};
        rebuildDashboard();
      }, (err) => {
        console.error('Sessions listener error:', err);
      });
    }

    // ─── Rebuild entire dashboard from data ──────────────────
    function rebuildDashboard() {
      updateStats();
      renderPlayersTable();
      renderLeaderboard();
      // Re-render session detail if one is expanded
      if (expandedPlayerUid && usersData[expandedPlayerUid]) {
        renderSessionDetail(expandedPlayerUid);
      } else {
        expandedPlayerUid = null;
        selectedSessionKey = null;
        document.getElementById('session-detail-container').innerHTML = '';
      }
    }

    // ─── Stats computation ───────────────────────────────────
    function updateStats() {
      const playerCount = Object.keys(usersData).length;
      let sessionCount = 0;
      let totalBalance = 0;
      let totalTime = 0;
      let sessionWithSummary = 0;

      for (const uid of Object.keys(sessionsData)) {
        const playerSessions = sessionsData[uid] || {};
        for (const sKey of Object.keys(playerSessions)) {
          sessionCount++;
          const summary = playerSessions[sKey]?.session_summary;
          if (summary) {
            sessionWithSummary++;
            totalBalance += summary.final_balance || 0;
            totalTime += summary.total_time_seconds || 0;
          }
        }
      }

      document.getElementById('stat-players').textContent = playerCount;
      document.getElementById('stat-sessions').textContent = sessionCount;
      document.getElementById('stat-balance').textContent = sessionWithSummary > 0 ? (totalBalance / sessionWithSummary).toFixed(2) : '-';
      document.getElementById('stat-time').textContent = sessionWithSummary > 0 ? formatTime(totalTime / sessionWithSummary) : '-';
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // ─── Players table ───────────────────────────────────────
    function renderPlayersTable() {
      const tbody = document.getElementById('players-tbody');
      const empty = document.getElementById('empty-players');
      const uids = Object.keys(usersData);

      if (uids.length === 0) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      let html = '';
      uids.forEach((uid, idx) => {
        const u = usersData[uid];
        const playerSessions = sessionsData[uid] || {};
        const sessionKeys = Object.keys(playerSessions);
        const sessionCount = sessionKeys.length;

        // Best score
        let bestScore = '-';
        let lastPlayed = '-';
        if (sessionCount > 0) {
          let best = -Infinity;
          let latest = '';
          sessionKeys.forEach(sk => {
            const summary = playerSessions[sk]?.session_summary;
            if (summary) {
              if ((summary.final_balance || 0) > best) best = summary.final_balance;
              if (summary.completed_at && summary.completed_at > latest) latest = summary.completed_at;
            }
          });
          bestScore = best > -Infinity ? best.toFixed(2) : '-';
          lastPlayed = latest ? formatDate(latest) : '-';
        }

        const rowBg = idx % 2 === 1 ? 'bg-stone/30' : '';
        const isExpanded = expandedPlayerUid === uid;

        html += `<tr class="${rowBg} hover:bg-sand/50 cursor-pointer transition-colors duration-300" onclick="togglePlayerDetail('${uid}')">
          <td class="py-5 px-6 text-base md:text-lg font-semibold">${escHtml(u.username || 'Unknown')}</td>
          <td class="py-5 px-6 text-base md:text-lg">${escHtml(u.email || '')}</td>
          <td class="py-5 px-6 text-base md:text-lg">${sessionCount}</td>
          <td class="py-5 px-6 text-base md:text-lg">${bestScore}</td>
          <td class="py-5 px-6 text-base md:text-lg">${lastPlayed}</td>
          ${isAdmin ? `<td class="py-5 px-6"><button onclick="event.stopPropagation(); confirmDeletePlayer('${uid}', '${escAttr(u.username || 'Unknown')}')" class="text-ember hover:bg-ember/10 rounded-full p-2 transition-all duration-300" title="Delete player"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></td>` : ''}
        </tr>`;
      });

      tbody.innerHTML = html;
    }

    // ─── Toggle session detail panel ─────────────────────────
    window.togglePlayerDetail = function(uid) {
      const container = document.getElementById('session-detail-container');
      if (expandedPlayerUid === uid) {
        // Collapse
        expandedPlayerUid = null;
        selectedSessionKey = null;
        container.innerHTML = '';
        return;
      }
      expandedPlayerUid = uid;
      selectedSessionKey = null;
      renderSessionDetail(uid);
    };

    function renderSessionDetail(uid) {
      const container = document.getElementById('session-detail-container');
      const user = usersData[uid];
      if (!user) { container.innerHTML = ''; return; }

      const playerSessions = sessionsData[uid] || {};
      const sessionKeys = Object.keys(playerSessions).sort().reverse();

      if (!selectedSessionKey || !playerSessions[selectedSessionKey]) {
        selectedSessionKey = sessionKeys[0] || null;
      }

      let html = `<div class="bg-cream rounded-[2rem] border border-timber mt-4 p-8 md:p-10 shadow-soft">`;

      // Player header
      html += `<div class="flex items-center justify-between mb-6 flex-wrap gap-4">
        <div class="flex items-center gap-3">
          <h4 id="detail-username-${uid}" class="font-heading text-xl font-bold text-loam">${escHtml(user.username || 'Unknown')}</h4>`;
      if (isAdmin) {
        html += `<button onclick="startEditUsername('${uid}', '${escAttr(user.username || '')}')" class="text-clay hover:text-moss p-1 transition-colors" title="Edit username">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
          </button>`;
      }
      html += `</div>
        <button onclick="togglePlayerDetail('${uid}')" class="text-grass hover:text-loam p-2 transition-colors" title="Close">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>`;

      // Session tabs
      if (sessionKeys.length > 0) {
        html += `<div class="flex flex-wrap gap-3 mb-8">`;
        sessionKeys.forEach(sk => {
          const isActive = sk === selectedSessionKey;
          const label = formatSessionKey(sk);
          html += `<div class="flex items-center gap-1">
            <button onclick="selectSession('${uid}', '${sk}')" class="${isActive ? 'bg-moss text-white' : 'bg-stone text-loam hover:bg-sand'} rounded-full px-5 py-2 text-base font-semibold transition-all duration-300">${label}</button>`;
          if (isAdmin && !isActive) {
            html += `<button onclick="event.stopPropagation(); confirmDeleteSession('${uid}', '${sk}')" class="text-ember hover:bg-ember/10 rounded-full p-1.5 transition-all duration-300" title="Delete session">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>`;
          }
          html += `</div>`;
        });
        html += `</div>`;

        // Render selected session content
        if (selectedSessionKey && playerSessions[selectedSessionKey]) {
          html += renderSessionContent(playerSessions[selectedSessionKey]);
        }
      } else {
        html += `<p class="text-grass text-lg text-center py-8">No sessions recorded</p>`;
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    window.selectSession = function(uid, sk) {
      selectedSessionKey = sk;
      renderSessionDetail(uid);
    };

    function renderSessionContent(session) {
      let html = '';
      const summary = session.session_summary || {};
      const inventory = session.inventory_logs || {};
      const transactions = session.transaction_history || {};

      // Session summary mini-cards
      html += `<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div class="bg-rice rounded-2xl p-6 border border-timber">
          <p class="font-heading text-3xl font-bold text-moss">${(summary.final_balance ?? 0).toFixed(2)}</p>
          <p class="text-sm md:text-base text-grass mt-1">Final Balance</p>
        </div>
        <div class="bg-rice rounded-2xl p-6 border border-timber">
          <p class="font-heading text-3xl font-bold text-moss">${formatTime(summary.total_time_seconds || 0)}</p>
          <p class="text-sm md:text-base text-grass mt-1">Total Time</p>
        </div>
        <div class="bg-rice rounded-2xl p-6 border border-timber">
          <p class="font-heading text-3xl font-bold text-moss">${summary.trash_disposed ?? 0}</p>
          <p class="text-sm md:text-base text-grass mt-1">Trash Disposed</p>
        </div>
        <div class="bg-rice rounded-2xl p-6 border border-timber">
          <span class="${summary.is_bento_unlocked ? 'bg-moss/15 text-moss' : 'bg-stone text-grass'} rounded-full px-4 py-2 text-base font-semibold inline-block">${summary.is_bento_unlocked ? 'Unlocked' : 'Locked'}</span>
          <p class="text-sm md:text-base text-grass mt-1">Bento Status</p>
        </div>
      </div>`;

      // Inventory chips
      html += `<h5 class="font-heading text-xl font-bold text-loam mb-4">Inventory</h5>
        <div class="flex flex-wrap gap-3 mb-8">`;
      const inventoryItems = Object.entries(inventory);
      if (inventoryItems.length === 0) {
        html += `<p class="text-grass text-base">No inventory data</p>`;
      } else {
        inventoryItems.forEach(([key, count]) => {
          const label = key.replace(/_count$/, '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
          if (count > 0) {
            html += `<span class="bg-sand text-loam rounded-full px-5 py-3 text-base font-semibold">${label} &times; ${count}</span>`;
          } else {
            html += `<span class="bg-stone/50 text-grass line-through rounded-full px-5 py-3 text-base font-semibold">${label}</span>`;
          }
        });
      }
      html += `</div>`;

      // Transaction history table
      const orderKeys = Object.keys(transactions).sort();
      html += `<h5 class="font-heading text-xl font-bold text-loam mb-4">Orders</h5>`;

      if (orderKeys.length === 0) {
        html += `<p class="text-grass text-base mb-4">No orders recorded</p>`;
      } else {
        html += `<div class="table-scroll bg-rice rounded-2xl border border-timber overflow-hidden mb-4">
          <table class="w-full min-w-[700px]">
            <thead>
              <tr class="bg-stone text-loam font-semibold text-base">
                <th class="py-4 px-4 text-left">#</th>
                <th class="py-4 px-4 text-left">Food</th>
                <th class="py-4 px-4 text-left">Drink</th>
                <th class="py-4 px-4 text-left">Cost</th>
                <th class="py-4 px-4 text-left">Paid</th>
                <th class="py-4 px-4 text-left">Change</th>
                <th class="py-4 px-4 text-center">Item</th>
                <th class="py-4 px-4 text-center">Change</th>
              </tr>
            </thead>
            <tbody>`;

        let correctOrders = 0;
        let correctChange = 0;

        orderKeys.forEach((ok, i) => {
          const o = transactions[ok];
          const itemCorrect = o.is_correct_item === true;
          const changeCorrect = o.is_change_correct === true;
          const hasError = !itemCorrect || !changeCorrect;
          if (itemCorrect && changeCorrect) correctOrders++;
          if (changeCorrect) correctChange++;

          html += `<tr class="${hasError ? 'bg-ember/10' : (i % 2 === 1 ? 'bg-stone/30' : '')}">
            <td class="py-4 px-4 text-base md:text-lg">${i + 1}</td>
            <td class="py-4 px-4 text-base md:text-lg">${escHtml(o.requested_food || '-')} &times; ${o.requested_food_qty || 0}</td>
            <td class="py-4 px-4 text-base md:text-lg">${escHtml(o.requested_drink || '-')} &times; ${o.requested_drink_qty || 0}</td>
            <td class="py-4 px-4 text-base md:text-lg">${(o.order_cost ?? 0).toFixed(2)}</td>
            <td class="py-4 px-4 text-base md:text-lg">${(o.amount_paid ?? 0).toFixed(2)}</td>
            <td class="py-4 px-4 text-base md:text-lg">${(o.change_given ?? 0).toFixed(2)}</td>
            <td class="py-4 px-4 text-center">${itemCorrect ? checkSVG : crossSVG}</td>
            <td class="py-4 px-4 text-center">${changeCorrect ? checkSVG : crossSVG}</td>
          </tr>`;
        });

        html += `</tbody></table></div>`;

        // Accuracy summary
        const totalOrders = orderKeys.length;
        const changeAccuracy = totalOrders > 0 ? Math.round((correctChange / totalOrders) * 100) : 0;
        const orderAccuracy = totalOrders > 0 ? Math.round((correctOrders / totalOrders) * 100) : 0;
        let accColor = 'text-moss';
        if (orderAccuracy < 50) accColor = 'text-ember';
        else if (orderAccuracy < 80) accColor = 'text-clay';

        html += `<div class="bg-rice rounded-2xl p-6 border border-timber mt-4">
          <p class="font-heading text-xl font-bold ${accColor}">${correctOrders} / ${totalOrders} orders correct</p>
          <p class="font-heading text-xl font-bold ${accColor} mt-1">Change accuracy: ${changeAccuracy}%</p>
        </div>`;
      }

      return html;
    }

    // SVG icons for checkmark and cross
    const checkSVG = `<svg class="w-6 h-6 text-moss inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>`;
    const crossSVG = `<svg class="w-6 h-6 text-ember inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>`;

    // ─── Leaderboard ─────────────────────────────────────────
    function renderLeaderboard() {
      const list = document.getElementById('leaderboard-list');

      // Collect best score per player
      const entries = [];
      for (const uid of Object.keys(usersData)) {
        const u = usersData[uid];
        const playerSessions = sessionsData[uid] || {};
        let best = -Infinity;
        let bestDate = '';
        for (const sk of Object.keys(playerSessions)) {
          const summary = playerSessions[sk]?.session_summary;
          if (summary && (summary.final_balance || 0) > best) {
            best = summary.final_balance;
            bestDate = summary.completed_at || '';
          }
        }
        if (best > -Infinity) {
          entries.push({ username: u.username || 'Unknown', score: best, date: bestDate });
        }
      }

      entries.sort((a, b) => b.score - a.score);

      if (entries.length === 0) {
        list.innerHTML = `<p class="text-grass text-lg text-center py-8">No data yet</p>`;
        return;
      }

      let html = '';
      entries.forEach((e, i) => {
        const rank = i + 1;
        const isTop3 = rank <= 3;
        html += `<div class="py-4 ${i < entries.length - 1 ? 'border-b border-timber/50' : ''} ${isTop3 ? 'border-l-4 border-moss pl-4' : 'pl-4'}">
          <div class="flex items-center justify-between">
            <div>
              <span class="font-heading ${isTop3 ? 'text-xl' : 'text-base'} font-bold text-loam">${rank}. ${escHtml(e.username)}</span>
            </div>
            <div class="text-right">
              <span class="font-heading ${isTop3 ? 'text-xl' : 'text-base'} font-bold text-moss">${e.score.toFixed(2)}</span>
              <p class="text-sm text-grass">${e.date ? formatDate(e.date) : ''}</p>
            </div>
          </div>
        </div>`;
      });

      list.innerHTML = html;
    }

    // ─── Admin: Delete player ────────────────────────────────
    window.confirmDeletePlayer = function(uid, username) {
      showModal({
        title: 'Delete Player',
        desc: `Are you sure you want to delete ${username}? This will remove their account data and all sessions. This cannot be undone.`,
        confirmText: 'Delete',
        confirmClass: 'bg-ember text-white',
        onConfirm: async () => {
          try {
            await remove(ref(db, 'users/' + uid));
            await remove(ref(db, 'sessions/' + uid));
            if (expandedPlayerUid === uid) {
              expandedPlayerUid = null;
              selectedSessionKey = null;
              document.getElementById('session-detail-container').innerHTML = '';
            }
            showToast('Player deleted successfully', 'success');
          } catch (e) {
            showToast('Failed to delete player: ' + e.message, 'error');
          }
          closeModal();
        }
      });
    };

    // ─── Admin: Delete session ───────────────────────────────
    window.confirmDeleteSession = function(uid, sessionKey) {
      const label = formatSessionKey(sessionKey);
      showModal({
        title: 'Delete Session',
        desc: `Delete session from ${label}?`,
        confirmText: 'Delete',
        confirmClass: 'bg-ember text-white',
        onConfirm: async () => {
          try {
            await remove(ref(db, 'sessions/' + uid + '/' + sessionKey));
            if (selectedSessionKey === sessionKey) selectedSessionKey = null;
            showToast('Session deleted', 'success');
          } catch (e) {
            showToast('Failed to delete session: ' + e.message, 'error');
          }
          closeModal();
        }
      });
    };

    // ─── Admin: Edit username ────────────────────────────────
    window.startEditUsername = function(uid, currentName) {
      showModal({
        title: 'Edit Username',
        desc: 'Enter a new username:',
        confirmText: 'Save',
        confirmClass: 'bg-moss text-white',
        showInput: true,
        inputPlaceholder: 'New username',
        inputValue: currentName,
        onConfirm: async () => {
          const newName = document.getElementById('modal-input').value.trim();
          if (!newName) {
            showToast('Username cannot be empty', 'error');
            return;
          }
          try {
            await update(ref(db, 'users/' + uid), { username: newName });
            showToast('Username updated', 'success');
          } catch (e) {
            showToast('Failed to update: ' + e.message, 'error');
          }
          closeModal();
        }
      });
    };

    // ─── Admin: Reset all data ───────────────────────────────
    window.startResetAll = function() {
      showModal({
        title: 'Reset All Data',
        desc: 'Are you sure you want to reset ALL data? This will delete all players and sessions.',
        confirmText: 'Continue',
        confirmClass: 'bg-ember text-white',
        onConfirm: () => {
          closeModal();
          // Step 2: type RESET
          setTimeout(() => {
            showModal({
              title: 'Confirm Reset',
              desc: 'Type "RESET" to confirm. This cannot be undone.',
              confirmText: 'Reset All Data',
              confirmClass: 'bg-ember text-white',
              showInput: true,
              inputPlaceholder: 'Type "RESET" to confirm',
              requireExact: 'RESET',
              onConfirm: async () => {
                try {
                  // Delete all sessions
                  await remove(ref(db, 'sessions'));
                  // Delete all users except current admin
                  const uids = Object.keys(usersData);
                  for (const uid of uids) {
                    if (uid !== currentUser.uid) {
                      await remove(ref(db, 'users/' + uid));
                    }
                  }
                  expandedPlayerUid = null;
                  selectedSessionKey = null;
                  document.getElementById('session-detail-container').innerHTML = '';
                  showToast('All data has been reset', 'success');
                } catch (e) {
                  showToast('Failed to reset: ' + e.message, 'error');
                }
                closeModal();
              }
            });
          }, 200);
        }
      });
    };

    // ─── Export functions ─────────────────────────────────────
    window.toggleExportDropdown = function() {
      document.getElementById('export-dropdown').classList.toggle('hidden');
    };
    // Close dropdown on outside click
    document.addEventListener('click', (e) => {
      const wrapper = document.getElementById('export-dropdown-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        document.getElementById('export-dropdown').classList.add('hidden');
      }
    });

    window.exportJSON = function() {
      const data = { users: usersData, sessions: sessionsData };
      const content = JSON.stringify(data, null, 2);
      downloadFile(content, `bentoboss_data_${todayStr()}.json`, 'application/json');
      showToast('JSON exported', 'success');
      document.getElementById('export-dropdown').classList.add('hidden');
    };

    window.exportCSV = function() {
      const rows = [['Username', 'Email', 'Session Date', 'Final Balance', 'Total Time (seconds)', 'Total Orders', 'Correct Orders', 'Change Accuracy (%)', 'Bento Unlocked']];

      for (const uid of Object.keys(usersData)) {
        const u = usersData[uid];
        const playerSessions = sessionsData[uid] || {};
        for (const sk of Object.keys(playerSessions)) {
          const s = playerSessions[sk];
          const summary = s?.session_summary || {};
          const transactions = s?.transaction_history || {};
          const orderKeys = Object.keys(transactions);
          const totalOrders = orderKeys.length;
          let correctOrders = 0;
          let correctChange = 0;
          orderKeys.forEach(ok => {
            const o = transactions[ok];
            if (o.is_correct_item && o.is_change_correct) correctOrders++;
            if (o.is_change_correct) correctChange++;
          });
          const changeAcc = totalOrders > 0 ? Math.round((correctChange / totalOrders) * 100) : 0;

          rows.push([
            csvSafe(u.username || ''),
            csvSafe(u.email || ''),
            csvSafe(formatSessionKey(sk)),
            (summary.final_balance ?? 0).toFixed(2),
            Math.round(summary.total_time_seconds || 0),
            totalOrders,
            correctOrders,
            changeAcc,
            summary.is_bento_unlocked ? 'Yes' : 'No'
          ]);
        }
      }

      const content = rows.map(r => r.join(',')).join('\n');
      downloadFile(content, `bentoboss_data_${todayStr()}.csv`, 'text/csv');
      showToast('CSV exported', 'success');
      document.getElementById('export-dropdown').classList.add('hidden');
    };

    function csvSafe(val) {
      const str = String(val);
      if (str.includes(',') || str.includes('"') || str.includes('\n')) {
        return '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // ─── Modal system ────────────────────────────────────────
    let modalOnConfirm = null;

    function showModal({ title, desc, confirmText, confirmClass, onConfirm, showInput, inputPlaceholder, inputValue, requireExact }) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-desc').textContent = desc;

      const inputArea = document.getElementById('modal-input-area');
      const input = document.getElementById('modal-input');
      if (showInput) {
        inputArea.classList.remove('hidden');
        input.value = inputValue || '';
        input.placeholder = inputPlaceholder || '';
      } else {
        inputArea.classList.add('hidden');
      }

      const btnArea = document.getElementById('modal-buttons');
      btnArea.innerHTML = `
        <button onclick="closeModal()" class="border-2 border-timber text-loam hover:bg-stone rounded-full px-8 h-12 text-base font-semibold transition-all duration-300">Cancel</button>
        <button id="modal-confirm-btn" class="${confirmClass} rounded-full px-8 h-12 text-base font-bold transition-all duration-300 hover:scale-105 active:scale-95">${confirmText}</button>
      `;

      const confirmBtn = document.getElementById('modal-confirm-btn');

      if (requireExact) {
        confirmBtn.disabled = true;
        confirmBtn.classList.add('opacity-40');
        input.oninput = () => {
          if (input.value === requireExact) {
            confirmBtn.disabled = false;
            confirmBtn.classList.remove('opacity-40');
          } else {
            confirmBtn.disabled = true;
            confirmBtn.classList.add('opacity-40');
          }
        };
      }

      modalOnConfirm = onConfirm;
      confirmBtn.onclick = () => {
        if (modalOnConfirm) modalOnConfirm();
      };

      const overlay = document.getElementById('modal-overlay');
      const card = document.getElementById('modal-card');
      overlay.classList.remove('hidden');
      requestAnimationFrame(() => {
        card.classList.remove('scale-95', 'opacity-0');
        card.classList.add('scale-100', 'opacity-100');
      });
    }

    window.closeModal = function() {
      const overlay = document.getElementById('modal-overlay');
      const card = document.getElementById('modal-card');
      card.classList.add('scale-95', 'opacity-0');
      card.classList.remove('scale-100', 'opacity-100');
      setTimeout(() => {
        overlay.classList.add('hidden');
        modalOnConfirm = null;
      }, 200);
    };

    window.closeModalOnBackdrop = function(e) {
      if (e.target === e.currentTarget) closeModal();
    };

    // ─── Toast notifications ─────────────────────────────────
    function showToast(message, type) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `${type === 'success' ? 'bg-moss' : 'bg-ember'} text-white rounded-2xl shadow-lift px-6 py-4 text-base font-semibold transition-all duration-300 opacity-0 translate-y-2`;
      toast.textContent = message;
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', 'translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');
      });
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        toast.classList.remove('opacity-100', 'translate-y-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // ─── Logout ──────────────────────────────────────────────
    window.handleLogout = async function() {
      try {
        await signOut(auth);
        // onAuthStateChanged will redirect
      } catch (e) {
        showToast('Failed to log out', 'error');
      }
    };

    // ─── Utility helpers ─────────────────────────────────────
    function escHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function escAttr(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function formatDate(isoStr) {
      try {
        const d = new Date(isoStr);
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' +
               d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      } catch (e) {
        return isoStr;
      }
    }

    function formatSessionKey(sk) {
      // Format YYYYMMDD_HHMM to readable date
      try {
        const parts = sk.split('_');
        if (parts.length === 2 && parts[0].length === 8) {
          const y = parts[0].substring(0, 4);
          const m = parts[0].substring(4, 6);
          const d = parts[0].substring(6, 8);
          const hh = parts[1].substring(0, 2);
          const mm = parts[1].substring(2, 4);
          const date = new Date(`${y}-${m}-${d}T${hh}:${mm}:00`);
          return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' +
                 date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }
      } catch (e) {}
      return sk;
    }
  </script>
</body>
