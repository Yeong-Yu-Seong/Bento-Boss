<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Boss — Login</title>
    <link rel="icon" id="favicon" href="" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: "#FFF4D8",
              rice: "#FDFCF8",
              loam: "#4C3737",
              moss: "#5D7052",
              clay: "#C18C5D",
              sand: "#E6DCCD",
              bark: "#4A4A40",
              stone: "#F0EBE5",
              grass: "#78786C",
              timber: "#DED8CF",
              sienna: "#A85448",
              ember: "#AC3737",
            },
            fontFamily: {
              heading: ["Fraunces", "Georgia", "serif"],
              body: ["Nunito", "sans-serif"],
            },
            borderRadius: {
              blob: "60% 40% 30% 70% / 60% 30% 70% 40%",
              "blob-2": "40% 60% 70% 30% / 40% 70% 30% 60%",
              organic: "2rem",
              "organic-lg": "3rem",
            },
            boxShadow: {
              soft: "0 4px 20px -2px rgba(93, 112, 82, 0.15)",
              float: "0 10px 40px -10px rgba(193, 140, 93, 0.2)",
              lift: "0 20px 40px -10px rgba(93, 112, 82, 0.15)",
            },
          },
        },
      };
    </script>
    <style>
      /* Grain texture overlay */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.035;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 128px 128px;
      }
    </style>
  </head>
  <body
    class="bg-cream font-body text-loam min-h-screen flex items-center justify-center relative overflow-x-hidden"
  >
    <!-- Decorative blobs -->
    <div
      class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-moss/10 rounded-blob blur-3xl pointer-events-none z-0"
    ></div>
    <div
      class="absolute bottom-[-15%] right-[-5%] w-[600px] h-[600px] bg-clay/10 rounded-blob-2 blur-3xl pointer-events-none z-0"
    ></div>
    <div
      class="absolute top-[40%] right-[10%] w-[300px] h-[300px] bg-sand/30 rounded-blob blur-3xl pointer-events-none z-0"
    ></div>

    <!-- Main card -->
    <div class="relative z-10 w-full mx-4 max-w-md md:max-w-lg 2xl:max-w-xl">
      <div
        class="bg-rice rounded-[2rem] shadow-soft border border-timber p-8 md:p-10"
      >
        <!-- Logo + Branding -->
        <div class="flex flex-col items-center text-center mb-6">
          <!-- Logo placeholder (replaced on load) -->
          <div
            id="logo-placeholder"
            class="h-32 w-32 md:h-36 md:w-36 2xl:h-40 2xl:w-40 rounded-2xl bg-moss/10 animate-pulse mb-3"
          ></div>
          <img
            id="logo-img"
            src=""
            alt="Bento Boss Logo"
            class="h-32 w-32 md:h-36 md:w-36 2xl:h-40 2xl:w-40 rounded-2xl object-contain mb-3 hidden"
          />
          <h1 class="font-heading text-2xl md:text-3xl font-bold text-loam">
            Bento Boss
          </h1>
          <p class="text-sm md:text-base text-grass mt-1">
            Canteen Simulator Dashboard
          </p>
        </div>

        <!-- Tab switcher -->
        <div class="flex bg-stone rounded-full p-1 mb-5">
          <button
            id="tab-login"
            onclick="switchTab('login')"
            class="flex-1 text-center text-sm md:text-base font-semibold rounded-full py-2 transition-all duration-300 bg-moss text-white"
          >
            Login
          </button>
          <button
            id="tab-register"
            onclick="switchTab('register')"
            class="flex-1 text-center text-sm md:text-base font-semibold rounded-full py-2 transition-all duration-300 text-loam hover:bg-sand/50"
          >
            Register
          </button>
        </div>

        <!-- Error banner -->
        <div
          id="error-banner"
          class="hidden bg-ember/10 border border-ember/30 text-ember rounded-xl p-3 text-sm mb-4"
        ></div>

        <!-- Login form -->
        <form
          id="login-form"
          class="space-y-4 md:space-y-5"
          onsubmit="handleLogin(event)"
        >
          <div>
            <label class="text-sm font-semibold text-loam mb-2 block"
              >Email</label
            >
            <input
              type="email"
              id="login-email"
              placeholder="Enter your email address"
              class="rounded-full h-11 md:h-12 px-6 text-base w-full border-2 border-timber bg-white/60 focus:border-moss focus:ring-2 focus:ring-moss/20 focus:outline-none placeholder-grass transition-all duration-300"
            />
            <p
              id="login-email-error"
              class="hidden text-sm text-ember mt-1"
            ></p>
          </div>
          <div>
            <label class="text-sm font-semibold text-loam mb-2 block"
              >Password</label
            >
            <input
              type="password"
              id="login-password"
              placeholder="Enter your password"
              class="rounded-full h-11 md:h-12 px-6 text-base w-full border-2 border-timber bg-white/60 focus:border-moss focus:ring-2 focus:ring-moss/20 focus:outline-none placeholder-grass transition-all duration-300"
            />
            <p
              id="login-password-error"
              class="hidden text-sm text-ember mt-1"
            ></p>
            <a
              href="forgot-password.html"
              class="inline-block mt-2 text-clay hover:text-moss text-sm font-semibold transition-colors duration-300"
              >Forgot password?</a
            >
          </div>
          <button
            type="submit"
            id="login-btn"
            class="w-full h-11 md:h-12 bg-moss text-white rounded-full text-base md:text-lg font-bold mt-5 hover:scale-105 active:scale-95 shadow-soft hover:shadow-float transition-all duration-300"
          >
            Sign In
          </button>
        </form>

        <!-- Register form -->
        <form
          id="register-form"
          class="space-y-4 md:space-y-5 hidden"
          onsubmit="handleRegister(event)"
        >
          <div>
            <label class="text-sm font-semibold text-loam mb-2 block"
              >Username</label
            >
            <input
              type="text"
              id="reg-username"
              placeholder="Choose your username"
              class="rounded-full h-11 md:h-12 px-6 text-base w-full border-2 border-timber bg-white/60 focus:border-moss focus:ring-2 focus:ring-moss/20 focus:outline-none placeholder-grass transition-all duration-300"
            />
            <p
              id="reg-username-error"
              class="hidden text-sm text-ember mt-1"
            ></p>
          </div>
          <div>
            <label class="text-sm font-semibold text-loam mb-2 block"
              >Email</label
            >
            <input
              type="email"
              id="reg-email"
              placeholder="Enter your email address"
              class="rounded-full h-11 md:h-12 px-6 text-base w-full border-2 border-timber bg-white/60 focus:border-moss focus:ring-2 focus:ring-moss/20 focus:outline-none placeholder-grass transition-all duration-300"
            />
            <p id="reg-email-error" class="hidden text-sm text-ember mt-1"></p>
          </div>
          <div>
            <label class="text-sm font-semibold text-loam mb-2 block"
              >Password</label
            >
            <input
              type="password"
              id="reg-password"
              placeholder="Create a password (min. 6 characters)"
              class="rounded-full h-11 md:h-12 px-6 text-base w-full border-2 border-timber bg-white/60 focus:border-moss focus:ring-2 focus:ring-moss/20 focus:outline-none placeholder-grass transition-all duration-300"
            />
            <p
              id="reg-password-error"
              class="hidden text-sm text-ember mt-1"
            ></p>
          </div>
          <div>
            <label class="text-sm font-semibold text-loam mb-2 block"
              >Confirm Password</label
            >
            <input
              type="password"
              id="reg-confirm"
              placeholder="Confirm your password"
              class="rounded-full h-11 md:h-12 px-6 text-base w-full border-2 border-timber bg-white/60 focus:border-moss focus:ring-2 focus:ring-moss/20 focus:outline-none placeholder-grass transition-all duration-300"
            />
            <p
              id="reg-confirm-error"
              class="hidden text-sm text-ember mt-1"
            ></p>
          </div>
          <button
            type="submit"
            id="register-btn"
            class="w-full h-11 md:h-12 bg-moss text-white rounded-full text-base md:text-lg font-bold mt-5 hover:scale-105 active:scale-95 shadow-soft hover:shadow-float transition-all duration-300"
          >
            Create Account
          </button>
        </form>

        <!-- Studio credit -->
        <p class="text-center text-sm text-grass mt-6">by Jellyfish</p>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="./index.js"></script>
  </body>
</html>
