<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Boss — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: "#FFF4D8",
              rice: "#FDFCF8",
              loam: "#4C3737",
              moss: "#5D7052",
              clay: "#C18C5D",
              sand: "#E6DCCD",
              bark: "#4A4A40",
              stone: "#F0EBE5",
              grass: "#78786C",
              timber: "#DED8CF",
              sienna: "#A85448",
              ember: "#AC3737",
            },
            fontFamily: {
              heading: ["Fraunces", "Georgia", "serif"],
              body: ["Nunito", "sans-serif"],
            },
            borderRadius: {
              blob: "60% 40% 30% 70% / 60% 30% 70% 40%",
              "blob-2": "40% 60% 70% 30% / 40% 70% 30% 60%",
              organic: "2rem",
              "organic-lg": "3rem",
            },
            boxShadow: {
              soft: "0 4px 20px -2px rgba(93, 112, 82, 0.15)",
              float: "0 10px 40px -10px rgba(193, 140, 93, 0.2)",
              lift: "0 20px 40px -10px rgba(93, 112, 82, 0.15)",
            },
          },
        },
      };
    </script>
    <style>
      /* Grain texture overlay */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.035;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 128px 128px;
      }
    </style>
  </head>
  <body
    class="bg-cream font-body text-loam min-h-screen flex items-center justify-center relative overflow-x-hidden"
  >
    <!-- Decorative blobs -->
    <div
      class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-moss/10 rounded-blob blur-3xl pointer-events-none z-0"
    ></div>
    <div
      class="absolute bottom-[-15%] right-[-5%] w-[600px] h-[600px] bg-clay/10 rounded-blob-2 blur-3xl pointer-events-none z-0"
    ></div>
    <div
      class="absolute top-[40%] right-[10%] w-[300px] h-[300px] bg-sand/30 rounded-blob blur-3xl pointer-events-none z-0"
    ></div>

    <!-- Main card -->
    <div class="relative z-10 w-full mx-4 max-w-md md:max-w-lg 2xl:max-w-xl">
      <div
        class="bg-rice rounded-[2rem] shadow-soft border border-timber p-8 md:p-10"
      >
        <!-- Logo + Branding -->
        <div class="flex flex-col items-center text-center mb-6">
          <!-- Logo placeholder (replaced on load) -->
          <div
            id="logo-placeholder"
            class="h-32 w-32 md:h-36 md:w-36 2xl:h-40 2xl:w-40 rounded-2xl bg-moss/10 animate-pulse mb-3"
          ></div>
          <img
            id="logo-img"
            src=""
            alt="Bento Boss Logo"
            class="h-32 w-32 md:h-36 md:w-36 2xl:h-40 2xl:w-40 rounded-2xl object-contain mb-3 hidden"
          />
          <h1 class="font-heading text-2xl md:text-3xl font-bold text-loam">
            Bento Boss
          </h1>
          <p class="text-sm md:text-base text-grass mt-1">
            Canteen Simulator Dashboard
          </p>
        </div>

        <!-- Tab switcher -->
        <div class="flex bg-stone rounded-full p-1 mb-5">
          <button
            id="tab-login"
            onclick="switchTab('login')"
            class="flex-1 text-center text-sm md:text-base font-semibold rounded-full py-2 transition-all duration-300 bg-moss text-white"
          >
            Login
          </button>
          <button
            id="tab-register"
            onclick="switchTab('register')"
            class="flex-1 text-center text-sm md:text-base font-semibold rounded-full py-2 transition-all duration-300 text-loam hover:bg-sand/50"
          >
            Register
          </button>
        </div>

        <!-- Error banner -->
        <div
          id="error-banner"
          class="hidden bg-ember/10 border border-ember/30 text-ember rounded-xl p-3 text-sm mb-4"
        ></div>

        <!-- Login form -->
        <form
          id="login-form"
          class="space-y-4 md:space-y-5"
          onsubmit="handleLogin(event)"
        >
          <div>
            <label class="text-sm font-semibold text-loam mb-2 block"
              >Email</label
            >
            <input
              type="email"
              id="login-email"
              placeholder="you@example.com"
              class="rounded-full h-11 md:h-12 px-6 text-base w-full border-2 border-timber bg-white/60 focus:border-moss focus:ring-2 focus:ring-moss/20 focus:outline-none placeholder-grass transition-all duration-300"
            />
            <p
              id="login-email-error"
              class="hidden text-sm text-ember mt-1"
            ></p>
          </div>
          <div>
            <label class="text-sm font-semibold text-loam mb-2 block"
              >Password</label
            >
            <input
              type="password"
              id="login-password"
              placeholder="Your password"
              class="rounded-full h-11 md:h-12 px-6 text-base w-full border-2 border-timber bg-white/60 focus:border-moss focus:ring-2 focus:ring-moss/20 focus:outline-none placeholder-grass transition-all duration-300"
            />
            <p
              id="login-password-error"
              class="hidden text-sm text-ember mt-1"
            ></p>
            <a
              href="forgot-password.html"
              class="inline-block mt-2 text-clay hover:text-moss text-sm font-semibold transition-colors duration-300"
              >Forgot password?</a
            >
          </div>
          <button
            type="submit"
            id="login-btn"
            class="w-full h-11 md:h-12 bg-moss text-white rounded-full text-base md:text-lg font-bold mt-5 hover:scale-105 active:scale-95 shadow-soft hover:shadow-float transition-all duration-300"
          >
            Sign In
          </button>
        </form>

        <!-- Register form -->
        <form
          id="register-form"
          class="space-y-4 md:space-y-5 hidden"
          onsubmit="handleRegister(event)"
        >
          <div>
            <label class="text-sm font-semibold text-loam mb-2 block"
              >Username</label
            >
            <input
              type="text"
              id="reg-username"
              placeholder="Choose a username"
              class="rounded-full h-11 md:h-12 px-6 text-base w-full border-2 border-timber bg-white/60 focus:border-moss focus:ring-2 focus:ring-moss/20 focus:outline-none placeholder-grass transition-all duration-300"
            />
            <p
              id="reg-username-error"
              class="hidden text-sm text-ember mt-1"
            ></p>
          </div>
          <div>
            <label class="text-sm font-semibold text-loam mb-2 block"
              >Email</label
            >
            <input
              type="email"
              id="reg-email"
              placeholder="you@example.com"
              class="rounded-full h-11 md:h-12 px-6 text-base w-full border-2 border-timber bg-white/60 focus:border-moss focus:ring-2 focus:ring-moss/20 focus:outline-none placeholder-grass transition-all duration-300"
            />
            <p id="reg-email-error" class="hidden text-sm text-ember mt-1"></p>
          </div>
          <div>
            <label class="text-sm font-semibold text-loam mb-2 block"
              >Password</label
            >
            <input
              type="password"
              id="reg-password"
              placeholder="At least 6 characters"
              class="rounded-full h-11 md:h-12 px-6 text-base w-full border-2 border-timber bg-white/60 focus:border-moss focus:ring-2 focus:ring-moss/20 focus:outline-none placeholder-grass transition-all duration-300"
            />
            <p
              id="reg-password-error"
              class="hidden text-sm text-ember mt-1"
            ></p>
          </div>
          <div>
            <label class="text-sm font-semibold text-loam mb-2 block"
              >Confirm Password</label
            >
            <input
              type="password"
              id="reg-confirm"
              placeholder="Re-enter your password"
              class="rounded-full h-11 md:h-12 px-6 text-base w-full border-2 border-timber bg-white/60 focus:border-moss focus:ring-2 focus:ring-moss/20 focus:outline-none placeholder-grass transition-all duration-300"
            />
            <p
              id="reg-confirm-error"
              class="hidden text-sm text-ember mt-1"
            ></p>
          </div>
          <button
            type="submit"
            id="register-btn"
            class="w-full h-11 md:h-12 bg-moss text-white rounded-full text-base md:text-lg font-bold mt-5 hover:scale-105 active:scale-95 shadow-soft hover:shadow-float transition-all duration-300"
          >
            Create Account
          </button>
        </form>

        <!-- Studio credit -->
        <p class="text-center text-sm text-grass mt-6">by Jellyfish</p>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
      import { app } from "./firebase-config.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import {
        getDatabase,
        ref,
        set,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
      import {
        getStorage,
        ref as storageRef,
        getDownloadURL,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

      const auth = getAuth(app);
      const db = getDatabase(app);
      const storage = getStorage(app);

      // Auth state check — redirect to dashboard if already logged in
      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.href = "dashboard.html";
        }
      });

      // Load logo from Firebase Storage
      async function loadLogo() {
        try {
          const logoRef = storageRef(storage, "logo.png");
          const logoURL = await getDownloadURL(logoRef);
          const img = document.getElementById("logo-img");
          const placeholder = document.getElementById("logo-placeholder");
          img.src = logoURL;
          img.onload = () => {
            placeholder.classList.add("hidden");
            img.classList.remove("hidden");
          };
          img.onerror = () => {
            placeholder.classList.add("hidden");
          };
        } catch (e) {
          document.getElementById("logo-placeholder").classList.add("hidden");
        }
      }
      loadLogo();

      // Map Firebase auth error codes to friendly messages
      function mapAuthError(code) {
        const map = {
          "auth/email-already-in-use": "This email is already registered.",
          "auth/wrong-password": "Incorrect password.",
          "auth/user-not-found": "No account found with this email.",
          "auth/weak-password": "Password must be at least 6 characters.",
          "auth/invalid-email": "Please enter a valid email.",
          "auth/too-many-requests":
            "Too many attempts. Please try again later.",
          "auth/invalid-credential": "Incorrect email or password.",
        };
        return map[code] || "Something went wrong. Please try again.";
      }

      function showError(msg) {
        const banner = document.getElementById("error-banner");
        banner.textContent = msg;
        banner.classList.remove("hidden");
      }
      function hideError() {
        document.getElementById("error-banner").classList.add("hidden");
      }
      function clearFieldErrors() {
        document.querySelectorAll('[id$="-error"]').forEach((el) => {
          if (el.id !== "error-banner") {
            el.classList.add("hidden");
            el.textContent = "";
          }
        });
      }
      function showFieldError(id, msg) {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.classList.remove("hidden");
      }

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // Handle Login
      window.handleLogin = async function (e) {
        e.preventDefault();
        hideError();
        clearFieldErrors();

        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;
        let valid = true;

        if (!email) {
          showFieldError("login-email-error", "Email is required.");
          valid = false;
        } else if (!emailRegex.test(email)) {
          showFieldError("login-email-error", "Please enter a valid email.");
          valid = false;
        }
        if (!password) {
          showFieldError("login-password-error", "Password is required.");
          valid = false;
        }

        if (!valid) return;

        const btn = document.getElementById("login-btn");
        btn.disabled = true;
        btn.textContent = "Signing in...";
        btn.classList.add("opacity-70");

        try {
          await signInWithEmailAndPassword(auth, email, password);
          // onAuthStateChanged will redirect
        } catch (err) {
          showError(mapAuthError(err.code));
          btn.disabled = false;
          btn.textContent = "Sign In";
          btn.classList.remove("opacity-70");
        }
      };

      // Handle Register
      window.handleRegister = async function (e) {
        e.preventDefault();
        hideError();
        clearFieldErrors();

        const username = document.getElementById("reg-username").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const password = document.getElementById("reg-password").value;
        const confirm = document.getElementById("reg-confirm").value;
        let valid = true;

        if (!username) {
          showFieldError("reg-username-error", "Username is required.");
          valid = false;
        }
        if (!email) {
          showFieldError("reg-email-error", "Email is required.");
          valid = false;
        } else if (!emailRegex.test(email)) {
          showFieldError("reg-email-error", "Please enter a valid email.");
          valid = false;
        }
        if (!password) {
          showFieldError("reg-password-error", "Password is required.");
          valid = false;
        } else if (password.length < 6) {
          showFieldError(
            "reg-password-error",
            "Password must be at least 6 characters.",
          );
          valid = false;
        }
        if (!confirm) {
          showFieldError("reg-confirm-error", "Please confirm your password.");
          valid = false;
        } else if (password !== confirm) {
          showFieldError("reg-confirm-error", "Passwords do not match.");
          valid = false;
        }

        if (!valid) return;

        const btn = document.getElementById("register-btn");
        btn.disabled = true;
        btn.textContent = "Creating account...";
        btn.classList.add("opacity-70");

        try {
          const cred = await createUserWithEmailAndPassword(
            auth,
            email,
            password,
          );
          // Write user profile to Realtime Database
          await set(ref(db, "users/" + cred.user.uid), {
            email: email,
            username: username,
            isAdmin: false,
          });
          // onAuthStateChanged will redirect to dashboard
        } catch (err) {
          showError(mapAuthError(err.code));
          btn.disabled = false;
          btn.textContent = "Create Account";
          btn.classList.remove("opacity-70");
        }
      };

      // Tab switching
      window.switchTab = function (tab) {
        hideError();
        clearFieldErrors();
        const loginForm = document.getElementById("login-form");
        const registerForm = document.getElementById("register-form");
        const tabLogin = document.getElementById("tab-login");
        const tabRegister = document.getElementById("tab-register");

        if (tab === "login") {
          loginForm.classList.remove("hidden");
          registerForm.classList.add("hidden");
          tabLogin.classList.add("bg-moss", "text-white");
          tabLogin.classList.remove("text-loam", "hover:bg-sand/50");
          tabRegister.classList.remove("bg-moss", "text-white");
          tabRegister.classList.add("text-loam", "hover:bg-sand/50");
        } else {
          loginForm.classList.add("hidden");
          registerForm.classList.remove("hidden");
          tabRegister.classList.add("bg-moss", "text-white");
          tabRegister.classList.remove("text-loam", "hover:bg-sand/50");
          tabLogin.classList.remove("bg-moss", "text-white");
          tabLogin.classList.add("text-loam", "hover:bg-sand/50");
        }
      };
    </script>
  </body>
</html>
