<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Boss — Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: "#FFF4D8",
              rice: "#FDFCF8",
              loam: "#4C3737",
              moss: "#5D7052",
              clay: "#C18C5D",
              sand: "#E6DCCD",
              bark: "#4A4A40",
              stone: "#F0EBE5",
              grass: "#78786C",
              timber: "#DED8CF",
              sienna: "#A85448",
              ember: "#AC3737",
            },
            fontFamily: {
              heading: ["Fraunces", "Georgia", "serif"],
              body: ["Nunito", "sans-serif"],
            },
            borderRadius: {
              blob: "60% 40% 30% 70% / 60% 30% 70% 40%",
              "blob-2": "40% 60% 70% 30% / 40% 70% 30% 60%",
              organic: "2rem",
              "organic-lg": "3rem",
            },
            boxShadow: {
              soft: "0 4px 20px -2px rgba(93, 112, 82, 0.15)",
              float: "0 10px 40px -10px rgba(193, 140, 93, 0.2)",
              lift: "0 20px 40px -10px rgba(93, 112, 82, 0.15)",
            },
          },
        },
      };
    </script>
    <style>
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.035;
        mix-blend-mode: multiply;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-size: 128px 128px;
      }
    </style>
  </head>
  <body
    class="bg-cream font-body text-loam min-h-screen flex items-center justify-center relative overflow-x-hidden"
  >
    <!-- Decorative blobs -->
    <div
      class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-moss/10 rounded-blob blur-3xl pointer-events-none z-0"
    ></div>
    <div
      class="absolute bottom-[-15%] right-[-5%] w-[600px] h-[600px] bg-clay/10 rounded-blob-2 blur-3xl pointer-events-none z-0"
    ></div>

    <!-- Main card -->
    <div class="relative z-10 w-full mx-4 max-w-md">
      <div
        class="bg-rice rounded-[2rem] shadow-soft border border-timber p-8 md:p-10"
      >
        <!-- Back link -->
        <a
          href="index.html"
          class="inline-flex items-center text-clay hover:text-moss text-sm font-semibold transition-colors duration-300 mb-4"
        >
          <svg
            class="w-4 h-4 mr-1"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 19l-7-7 7-7"
            />
          </svg>
          Back to login
        </a>

        <!-- Logo + Branding -->
        <div class="flex flex-col items-center text-center mb-6">
          <div
            id="logo-placeholder"
            class="h-28 w-28 md:h-32 md:w-32 rounded-2xl bg-moss/10 animate-pulse mb-3"
          ></div>
          <img
            id="logo-img"
            src=""
            alt="Bento Boss Logo"
            class="h-28 w-28 md:h-32 md:w-32 rounded-2xl object-contain mb-3 hidden"
          />
          <h1 class="font-heading text-2xl md:text-3xl font-bold text-loam">
            Reset Password
          </h1>
          <p class="text-sm md:text-base text-grass mt-1">
            Enter your email and we'll send you a reset link.
          </p>
        </div>

        <!-- Error banner -->
        <div
          id="error-banner"
          class="hidden bg-ember/10 border border-ember/30 text-ember rounded-xl p-3 text-sm mb-4"
        ></div>

        <!-- Reset form -->
        <form
          id="reset-form"
          class="space-y-4 md:space-y-5"
          onsubmit="handleReset(event)"
        >
          <div>
            <label class="text-sm font-semibold text-loam mb-2 block"
              >Email</label
            >
            <input
              type="email"
              id="reset-email"
              placeholder="you@example.com"
              class="rounded-full h-11 md:h-12 px-6 text-base w-full border-2 border-timber bg-white/60 focus:border-moss focus:ring-2 focus:ring-moss/20 focus:outline-none placeholder-grass transition-all duration-300"
            />
            <p
              id="reset-email-error"
              class="hidden text-sm text-ember mt-1"
            ></p>
          </div>
          <button
            type="submit"
            id="reset-btn"
            class="w-full h-11 md:h-12 bg-moss text-white rounded-full text-base md:text-lg font-bold mt-5 hover:scale-105 active:scale-95 shadow-soft hover:shadow-float transition-all duration-300"
          >
            Send Reset Link
          </button>
        </form>

        <!-- Success state (hidden by default) -->
        <div id="success-card" class="hidden">
          <div
            class="bg-moss/10 border border-moss/30 rounded-2xl p-6 text-center"
          >
            <svg
              class="w-12 h-12 mx-auto text-moss"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            <h2 class="font-heading text-xl font-bold text-moss mt-3">
              Email Sent!
            </h2>
            <p class="text-base text-loam mt-2">
              Check your inbox for a password reset link.
            </p>
            <a
              href="index.html"
              class="inline-block mt-5 bg-moss text-white rounded-full px-8 h-11 leading-[2.75rem] text-base font-bold hover:scale-105 active:scale-95 transition-all duration-300"
            >
              Back to Login
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getAuth,
        sendPasswordResetEmail,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
      import {
        getStorage,
        ref as storageRef,
        getDownloadURL,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBIlVLrB2iTMuy-rcj33pZUJaiWgxXC-aM",
        authDomain: "ip-y2-2.firebaseapp.com",
        databaseURL:
          "https://ip-y2-2-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "ip-y2-2",
        storageBucket: "ip-y2-2.firebasestorage.app",
        messagingSenderId: "460221501076",
        appId: "1:460221501076:web:fa88ac6d5ee80b23bdae81",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const storage = getStorage(app);

      // Redirect to dashboard if already logged in
      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.href = "dashboard.html";
        }
      });

      // Load logo from Firebase Storage
      async function loadLogo() {
        try {
          const logoRef = storageRef(storage, "logo.png");
          const logoURL = await getDownloadURL(logoRef);
          const img = document.getElementById("logo-img");
          const placeholder = document.getElementById("logo-placeholder");
          img.src = logoURL;
          img.onload = () => {
            placeholder.classList.add("hidden");
            img.classList.remove("hidden");
          };
          img.onerror = () => {
            placeholder.classList.add("hidden");
          };
        } catch (e) {
          document.getElementById("logo-placeholder").classList.add("hidden");
        }
      }
      loadLogo();

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      function showError(msg) {
        const banner = document.getElementById("error-banner");
        banner.textContent = msg;
        banner.classList.remove("hidden");
      }
      function hideError() {
        document.getElementById("error-banner").classList.add("hidden");
      }
      function showFieldError(id, msg) {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.classList.remove("hidden");
      }

      window.handleReset = async function (e) {
        e.preventDefault();
        hideError();
        document.getElementById("reset-email-error").classList.add("hidden");

        const email = document.getElementById("reset-email").value.trim();

        if (!email) {
          showFieldError("reset-email-error", "Email is required.");
          return;
        }
        if (!emailRegex.test(email)) {
          showFieldError("reset-email-error", "Please enter a valid email.");
          return;
        }

        const btn = document.getElementById("reset-btn");
        btn.disabled = true;
        btn.textContent = "Sending...";
        btn.classList.add("opacity-70");

        try {
          await sendPasswordResetEmail(auth, email);
          // Show success, hide form
          document.getElementById("reset-form").classList.add("hidden");
          document.getElementById("error-banner").classList.add("hidden");
          document.getElementById("success-card").classList.remove("hidden");
        } catch (err) {
          const map = {
            "auth/user-not-found": "No account found with this email.",
            "auth/invalid-email": "Please enter a valid email.",
            "auth/too-many-requests":
              "Too many attempts. Please try again later.",
          };
          showError(map[err.code] || "Something went wrong. Please try again.");
          btn.disabled = false;
          btn.textContent = "Send Reset Link";
          btn.classList.remove("opacity-70");
        }
      };
    </script>
  </body>
</html>
